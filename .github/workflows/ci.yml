name: CI

on:
  push:
    branches: [main, nxnative]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    name: Window UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - name: Upload UI failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: macOS · checks + DMG
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - name: Confirm Apple silicon
        run: |
          uname -m
          test "$(uname -m)" = arm64
      - run: npm ci
      - name: Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Window checks
        run: |
          npm run lint
          npm run fmt:check
          npm test
      - name: Build the app
        run: npm run build
      - name: Make the DMG
        run: npm run dmg
      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: nxrt-dmg
          path: |
            dist/nxrt-*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nxrt-dmg
          path: artifact
      - uses: softprops/action-gh-release@v2
        with:
          files: artifact/*
          generate_release_notes: true
