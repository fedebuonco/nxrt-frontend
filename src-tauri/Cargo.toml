[package]
name = "nxrt-frontend"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A manager for nxrt Switch recomps: one library of games, their files and game code, Play"
publish = false

[lib]
name = "nxrt_frontend_lib"
path = "src/lib.rs"

[[bin]]
name = "nxrt-frontend"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
rfd = "0.15"
base64 = "0.22"
sdl3-sys = { version = "0.7", features = ["build-from-source-static"] }  # (controllers: SDL's own drivers, as the games)
tracing = "0.1"
libc = "0.2"  # (a run's process group: Stop signals it all)
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[profile.release]
lto = "thin"
