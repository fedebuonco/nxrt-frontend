- text: Preferences
- heading "Settings" [level=1]
- paragraph: The keys games are read with, and where the manager keeps its own things.
- text: Keys prod.keys
- button "Forget"
- button "Choose prod.keys…"
- paragraph: The keys from your own Switch (prod.keys). Needed to read the package; nothing is decrypted to disk.
- text: /tmp/nxrt-test Folders
- button "Scan games folder"
- button "Choose root…"
- paragraph: "One nxrt root: games/ is scanned for .nsp/.xci packages, each game's data (game files, saves, settings, mods) goes in data/<title id>/, and new recomps go in recomps/. Existing games keep their own folders."
- text: /tmp/nxrt-test/root games /tmp/nxrt-test/root/games data /tmp/nxrt-test/root/data recomps /tmp/nxrt-test/root/recomps
- button "Show in Finder"
- text: Controller (this window) Xbox Wireless Controller
- button "Controls…"
- paragraph: Any controller works over USB or Bluetooth, and is picked up while the window is focused. The D-pad or left stick moves, A selects, B goes back, and LB / RB change section.
- paragraph: If a connected controller isn't seen, allow Input Monitoring for nxrt in System Settings › Privacy & Security.
- text: A Select B Back X Play / Stop Y Details LB / RB Section D-pad Move Controller map Xbox Wireless Controller
- button "Test"
- paragraph: "Your controller defaults at a glance: each of the pad’s buttons and the nxrt input it sends. Test to see each one as you press it."
- text: Press Test, then a button. Face buttons
